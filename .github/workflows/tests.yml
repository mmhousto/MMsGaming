name: Tests

# Runs the full test suite against a throwaway database on every push and
# pull request. Hostinger deploys whatever lands on master, so merge to
# master only when this check is green.
on:
  push:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_DATABASE: mmsg_test
          MARIADB_USER: mmtest
          MARIADB_PASSWORD: testpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_USER: mmtest
      DB_PASS: testpw
      DB_NAME: mmsg_test

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mysqlnd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './tests/node_modules/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Install test tools
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: tests
        run: npx playwright test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 14
